name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron --no-sandbox --version
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: xvfb-run -a npm run smoke
        env:
          # GitHub-hosted runners cannot set the chrome-sandbox helper setuid-root.
          ELECTRON_EXTRA_ARGS: --no-sandbox
      - run: npx electron-builder --dir

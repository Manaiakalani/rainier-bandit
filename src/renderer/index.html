<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Jimothy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: no-drag;
    }
    #pet-canvas {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
    }
    #speech-bubble {
      display: none;
      position: absolute;
      bottom: 190px;
      left: 50%;
      transform: translateX(-50%);
      background: #faf6ee;
      color: #2c2420;
      border: 1.5px solid #4a3728;
      border-radius: 16px;
      padding: 8px 14px;
      font-family: "Avenir Next", "Segoe UI Variable", "Segoe UI", "Trebuchet MS", sans-serif;
      font-size: 13px;
      line-height: 1.35;
      letter-spacing: 0.01em;
      max-width: 240px;
      text-align: center;
      box-shadow: 0 3px 8px rgba(44, 36, 32, 0.2);
      pointer-events: none;
      z-index: 10;
    }
    #speech-bubble::after,
    #speech-bubble::before {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    #speech-bubble::before {
      bottom: -11px;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-top: 11px solid #4a3728;
    }
    #speech-bubble::after {
      bottom: -9px;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #faf6ee;
    }
    .boot-error {
      color: #8b3a2a;
      padding: 16px;
      font-family: "Segoe UI", sans-serif;
      font-size: 12px;
    }
    @media (prefers-reduced-motion: reduce) {
      #speech-bubble { transition: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="pet-canvas" width="200" height="200" role="img" aria-label="Jimothy the raccoon"></canvas>
  <div id="speech-bubble" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <script src="./bundle.js"></script>
</body>
</html>
